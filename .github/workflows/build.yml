name: Build Native WebView APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create Native Android Project
        run: |
          # Buat struktur folder proyek Android minimum
          mkdir -p native_app/app/src/main/java/com/router/admin
          mkdir -p native_app/app/src/main/res/layout
          mkdir -p native_app/app/src/main/res/drawable

          # Download Icon dari link Anda
          curl -s -L "https://media.licdn.com/dms/image/v2/D560BAQGeXiMzYHWgRA/company-logo_200_200/B56Zt8puBZIcAI-/0/1767322870258/zte_indonesia_logo?e=2147483647&v=beta&t=7aWKMYfj1Y7czyRm8BZ0cRoPTH12WmqKH_wAQrZaVSY" -o native_app/app/src/main/res/drawable/icon.png

          # 1. Buat AndroidManifest.xml (Tanpa atribut package, namespace diatur di build.gradle)
          cat <<EOF > native_app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="Router Admin"
                  android:roundIcon="@drawable/icon"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. Buat gradle.properties
          cat <<EOF > native_app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 3. Buat build.gradle (Module level - AGP 8.2.2)
          cat <<EOF > native_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.router.admin'
              compileSdk 34

              defaultConfig {
                  applicationId "com.router.admin"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # 4. Buat settings.gradle
          cat <<EOF > native_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RouterAdmin"
          include ':app'
          EOF

          # 5. Buat build.gradle (Project level dengan AGP 8.2.2)
          cat <<EOF > native_app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 6. Kunci versi Gradle ke 8.5 yang stabil
          mkdir -p native_app/gradle/wrapper
          cat <<EOF > native_app/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/path
          EOF

          # 7. Buat Layout XML untuk WebView
          cat <<EOF > native_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </RelativeLayout>
          EOF

          # 8. Buat MainActivity.java
          cat <<EOF > native_app/app/src/main/java/com/router/admin/MainActivity.java
          package com.router.admin;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  WebSettings webSettings = webView.getSettings();
                  
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setSaveFormData(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("http://192.168.1.1/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd native_app
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp native_app/app/build/outputs/apk/debug/app-debug.apk output/router-admin-native.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Router Admin Native v2.1.${{ github.run_number }}
          body: |
            APK Native Router Admin berhasil di-build dengan stabil!
            - Gradle 8.5 & AGP 8.2.2 (Stabil & Bebas Konflik)
            - Password Manager / Autofill Google aktif
            - URL: http://192.168.1.1/
          files: output/router-admin-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
