name: Build APK from Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK Tools
        uses: android-actions/setup-android@v4

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          # Buat project cordova
          cordova create router_app com.router.admin "Router Admin"
          cd router_app

          # Tambah platform android
          cordova platform add android

          # Download Icon
          mkdir -p res
          curl -s -L "https://media.licdn.com/dms/image/v2/D560BAQGeXiMzYHWgRA/company-logo_200_200/B56Zt8puBZIcAI-/0/1767322870258/zte_indonesia_logo?e=2147483647&v=beta&t=7aWKMYfj1Y7czyRm8BZ0cRoPTH12WmqKH_wAQrZaVSY" -o res/icon.png

          # Edit config.xml untuk mengizinkan HTTP Cleartext Traffic
          cat <<EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.router.admin" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Router Admin</name>
              <description>Aplikasi Router Admin</description>
              <author email="dev@example.com">Developer</author>
              <content src="http://192.168.1.1/" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="http://192.168.1.1/*" />
              <preference name="Orientation" value="default" />
              <preference name="SplashScreenDelay" value="3000" />
              <preference name="AutoHideSplashScreen" value="true" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
                  <application android:usesCleartextTraffic="true" />
              </edit-config>
              <icon src="res/icon.png" />
          </widget>
          EOF

      - name: Build Android APK
        run: |
          cd router_app
          cordova build android --debug

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp router_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk output/router-admin.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Router Admin Release v1.0.${{ github.run_number }}
          body: |
            APK Router Admin berhasil di-build (Cleartext Traffic diizinkan).
            URL: http://192.168.1.1/
          files: output/router-admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
